---
# Middleware: TLS redirect (HTTP → HTTPS 301)
# Applied to all HTTP traffic on EntryPoint web (:80)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tls-redirect
  namespace: aionui
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# Middleware: Security headers (FR-013)
# HSTS, X-Frame-Options DENY, X-Content-Type-Options nosniff, Referrer-Policy
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: aionui
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-XSS-Protection: "0"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
